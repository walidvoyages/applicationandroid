name: Publish APK for testers on GitHub Releases

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-test-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build installable Android APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Create GitHub Release with test APK
        uses: softprops/action-gh-release@v2
        with:
          name: 'Walid Voyages Android — ${{ github.ref_name }} (test APK)'
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            APK de test Android, pas une version Play Store signée pour production.
            Pour installer: téléchargez le APK sur votre Android puis autorisez l'installation depuis cette source.
